<script>
  const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxDqY78dB3Pw41a0IsssGgUaS82s8bdOBSDuNNteY6fRH996EfgMEeJOXYPi6wS7KZfFA/exec";
  const NOMOR_ADMIN = "6281211855946";
  const HARGA_PER_SIZE = {
    S: 150000,
    M: 150000,
    L: 150000,
    XL: 150000,
    XXL: 150000
  };

  function rupiah(value) {
    return "Rp " + Number(value || 0).toLocaleString("id-ID");
  }

  function hitungTotal() {
    const size = document.getElementById("ukuran").value;
    const qty = Math.max(0, Number(document.getElementById("jumlah").value) || 0);
    const total = (HARGA_PER_SIZE[size] || 0) * qty;
    document.getElementById("totalDisplay").textContent = rupiah(total);
    return total;
  }

  document.getElementById("ukuran").addEventListener("change", hitungTotal);
  document.getElementById("jumlah").addEventListener("input", hitungTotal);

  document.getElementById("orderForm").addEventListener("submit", async function (event) {
    event.preventDefault();

    const form = event.currentTarget;
    if (!form.reportValidity()) return;

    const btn = document.getElementById("submitBtn");
    btn.disabled = true;
    btn.textContent = "Menyimpan pesanan...";

    const noPO = "PO-" + Date.now().toString().slice(-6);
    const tanggal = new Date().toLocaleDateString("id-ID", {
      day: "numeric",
      month: "short",
      year: "numeric"
    });

    const nama = document.getElementById("nama").value.trim();
    const wa = document.getElementById("wa").value.trim();
    const ukuran = document.getElementById("ukuran").value;
    const jumlah = Number(document.getElementById("jumlah").value) || 1;
    const alamat = document.getElementById("alamat").value.trim();
    const totalText = rupiah(hitungTotal());
    const pesanan = `Kaos Kosmik Size ${ukuran} (${jumlah}x)`;

    const payload = new URLSearchParams({
      action: "simpan",
      no_po: noPO,
      tanggal: tanggal,
      nama: nama,
      wa: wa,
      ukuran: ukuran,
      jumlah: String(jumlah),
      pesanan: pesanan,
      total: totalText,
      alamat: alamat
    });

    const whatsappText = [
      "*ORDER KAOS KOSMIK BOGOR*",
      `No. PO: *${noPO}*`,
      `Nama: ${nama}`,
      `No. WA: ${wa}`,
      `Pesanan: ${pesanan}`,
      `Total: ${totalText}`,
      `Alamat: ${alamat}`
    ].join("\n");

    const whatsappUrl = `https://wa.me/${NOMOR_ADMIN}?text=${encodeURIComponent(whatsappText)}`;

    try {
      await fetch(URL_APPS_SCRIPT, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8"
        },
        body: payload.toString()
      });

      // setelah request terkirim, buka WhatsApp
      alert("Pesanan berhasil dikirim ke admin. Silakan lanjutkan ke WhatsApp.");
      window.location.href = whatsappUrl;

    } catch (error) {
      console.error("Gagal kirim:", error);
      alert("Pesanan belum tersimpan di Google Sheets. Coba lagi.");
    } finally {
      btn.disabled = false;
      btn.textContent = "Simpan & Kirim ke WhatsApp";
    }
  });

  hitungTotal();
</script>
